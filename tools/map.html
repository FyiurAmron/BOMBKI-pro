<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOMBKI room map</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0e151f;
      color: #edf3fa;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    #layer-menu {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
      padding: 20px 14px;
      overflow: auto;
      background: #151f2d;
      border-right: 1px solid #2a3a50;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
    }

    .brand p,
    .menu-note {
      margin: 7px 0 0;
      color: #9fb0c4;
      font-size: .78rem;
      line-height: 1.4;
    }

    #layer-list {
      display: grid;
      gap: 7px;
    }

    .layer-toggle {
      display: grid;
      grid-template-columns: 15px 1fr auto;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 10px;
      border: 1px solid #35475d;
      border-radius: 8px;
      background: #1a2736;
      color: #d9e3ee;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .layer-toggle:hover { background: #24364a; }

    .layer-toggle[aria-pressed="true"] {
      border-color: #57c6bc;
      background: #1d454b;
      color: #fff;
      box-shadow: inset 3px 0 #57c6bc;
    }

    .layer-dot {
      width: 13px;
      height: 13px;
      border: 1px solid #ffffff70;
      border-radius: 4px;
      background: var(--layer-color);
    }

    .layer-count {
      color: #9fb0c4;
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }

    .menu-note {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid #2a3a50;
    }

    #map-area {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #map-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 22px;
      padding: 12px 18px;
      background: #151f2d;
      border-bottom: 1px solid #2a3a50;
    }

    #map-status {
      margin-right: auto;
      color: #c0cddd;
      font-size: .88rem;
    }

    #map-status strong { color: #fff; }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      color: #c0cddd;
      font-size: .76rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-line {
      position: relative;
      width: 24px;
      border-top: 2px solid #a9bfd8;
    }

    .legend-line.one-way::after {
      position: absolute;
      top: -5px;
      right: -1px;
      content: "▶";
      color: #a9bfd8;
      font-size: 9px;
    }

    .legend-line.conditional { border-top: 2px dashed #efbd56; }
    .legend-vertical { color: #82d4c9; font-weight: 800; }

    #map-shell {
      flex: 1;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 20px;
      background: #0e151f;
    }

    #map-canvas {
      position: relative;
      margin: 0 auto;
      border: 1px solid #53647a;
      border-radius: 8px;
      background-color: #111b28;
      background-image:
        linear-gradient(to right, #73849a38 1px, transparent 1px),
        linear-gradient(to bottom, #73849a38 1px, transparent 1px);
    }

    #connections {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: visible;
      pointer-events: none;
    }

    .connection {
      fill: none;
      stroke: #a9bfd8;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .connection.conditional {
      stroke: #efbd56;
      stroke-dasharray: 5 4;
    }

    .room {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 6px;
      overflow: hidden;
      border: 1px solid #8fc5d5;
      border-radius: 8px;
      background: #205b72;
      color: #fff;
      text-align: center;
      box-shadow: 0 4px 10px #0008;
    }

    .room-name {
      max-width: 100%;
      font-size: .76rem;
      font-weight: 750;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .room-coordinates {
      color: #c7d9e6;
      font-size: .58rem;
      font-variant-numeric: tabular-nums;
    }

    .vertical-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      max-width: 100%;
    }

    .vertical-link {
      display: block;
      flex: 1 1 100%;
      max-width: 100%;
      padding: 2px 4px;
      border: 1px solid var(--target-layer-color);
      border-radius: 4px;
      background: color-mix(in srgb, var(--target-layer-color) 18%, #173f43);
      color: #e4edf4;
      font-size: .61rem;
      font-family: inherit;
      line-height: 1.15;
      overflow-wrap: anywhere;
      white-space: normal;
      text-align: center;
      cursor: pointer;
    }

    .vertical-link:hover { filter: brightness(1.25); }
    .vertical-link:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

    .vertical-link.conditional {
      outline: 1px dashed #efbd56;
      outline-offset: -2px;
    }

    .vertical-direction {
      color: var(--target-layer-color);
      font-weight: 850;
    }

    #empty-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #9fb0c4;
      font-size: 1rem;
      text-align: center;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      body { grid-template-columns: 185px minmax(0, 1fr); }
      #layer-menu { padding: 14px 10px; }
      #map-header { padding: 10px 12px; }
      #map-shell { padding: 12px; }
      #legend { gap: 7px 10px; }
    }
  </style>
</head>
<body>
  <aside id="layer-menu">
    <div class="brand">
      <h1>BOMBKI map</h1>
      <p>Room layers by Z coordinate</p>
    </div>
    <nav id="layer-list" aria-label="Map layers"></nav>
    <p class="menu-note">Select a layer to view its rooms and exits. Click the selected layer again to hide it. Vertical exits are marked on room tiles.</p>
  </aside>
  <main id="map-area">
    <header id="map-header">
      <div id="map-status" aria-live="polite">Loading map...</div>
      <div id="legend" aria-label="Connection legend">
        <span class="legend-item"><span class="legend-line"></span>Two-way exit</span>
        <span class="legend-item"><span class="legend-line one-way"></span>One-way exit</span>
        <span class="legend-item"><span class="legend-line conditional"></span>Conditional exit</span>
        <span class="legend-item"><span class="legend-vertical">UP to room</span>Vertical exit target</span>
      </div>
    </header>
    <section id="map-shell" aria-label="Room map">
      <div id="map-canvas">
        <svg id="connections" aria-label="Room connections" role="img">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9bfd8"></path>
            </marker>
            <marker id="conditional-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#efbd56"></path>
            </marker>
          </defs>
        </svg>
        <div id="empty-state" hidden></div>
      </div>
    </section>
  </main>

    const mapData = {"rooms":[{"id":10,"name":"Pokój 5","entry":"Jesteś w dosyć ciasnym pokoju i niczego tu nie ma","x":-3,"y":-1,"z":-1},{"id":3,"name":"Poddziemny pokój treningowy (2)","entry":"Zszedłeś na DÓŁ gdzie trenuje się medytując\nNa środku na wielki materac przeznaczony do medytacji\nNa ściance jest piękniutki PLAKAT","x":0,"y":-1,"z":-1},{"id":62,"name":"Tłum 2","entry":"Na brzegach tłum jest mniejszy, mimo to uczucie ścisku irytuje cię","x":-1,"y":0,"z":-1},{"id":65,"name":"Tłum 5","entry":"Jesteś z boku ale przy balustradkach ludzie wpychają cię na te balustradki\nNie można oddychać w takim tłumie - lepiej szybko stąd idź","x":0,"y":0,"z":-1},{"id":72,"name":"Scena 3","entry":"Ufff przebiegłeś przez środek sceny więc trema cię już nie dręczy\nDalej pisać nie ma o czym więc możesz mi naskoczyć","x":1,"y":0,"z":-1},{"id":60,"name":"Jaskinia Rozrywek","entry":"Jesteś w Jaskini Rozrywek. Jaskinia ciągnie się na PÓŁNOC, na WSCHODZIE\njest słyszalny jakiś dziwny hałas, na zachodzie zaś \"la la la la\" \nZawsze możesz wrócić się idąc na GÓRĘ ;)","x":-2,"y":1,"z":-1},{"id":61,"name":"Tłum 1","entry":"Kiedy podszedłeś bliżej zbaraniałeś - to sala koncertowa!!!\nWokół tłumy słuchają muzyki, dziwna to muzyka - właściwie same słowa\nNa ścianie jest PLAKAT","x":-1,"y":1,"z":-1},{"id":64,"name":"Tłum 4","entry":"Jesteś w środku tłumu a do tego przy balustradkach - co za tłok\nNie można oddychać w takim tłumie - lepiej szybko stąd idź","x":0,"y":1,"z":-1},{"id":71,"name":"Środek sceny","entry":"Ludzie się na ciebie gapią, jesteś na środku sceny!!! Któś ci mówi:\nHey man it's cool yeah! A ty na to: je je kul kul...","x":1,"y":1,"z":-1},{"id":63,"name":"Tłum 3","entry":"Na brzegach tłum jest rzadszy, boisz się pomyśleć co się dzieje w środku","x":-1,"y":2,"z":-1},{"id":66,"name":"Tłum 6","entry":"Jesteś przy balustradkach - nie będę się rozwodził jak ci jest ciasno","x":0,"y":2,"z":-1},{"id":70,"name":"Scena 1","entry":"All right - jesteś na scenie!!! Na twój widok och kój 2","entry":"Jesteś w dosyć ciasnym pokoju i niczego tu nie ma","x":-3,"y":0,"z":0},{"id":31,"name":"Ul. Długa 2","entry":"Idąc ulicą długą na PÓŁNOC spostrzegasz Jaskinię Rozrywek\nA na POŁUDNIE baśniowy gaj...","x":-2,"y":0,"z":0},{"id":30,"name":"Ul. Długa","entry":"Ulica Długa ciągnie się w nieskończoność, sorki\nNa GÓRZE prowadzą kręte schody na arenę przeznaczoną do walki","x":-1,"y":0,"z":0},{"id":20,"name":"Centrum miasta","entry":"Jesteś w centrum miasta: na ścianie jest PLAKAT (duży ruch)","x":0,"y":0,"z":0},{"id":89,"name":"Przejście na Ciemną","entry":"Jesteś w przejściu na Ulicę Ciemną.\nJest tam ciemno.","x":1,"y":0,"z":0},{"id":73,"name":"Droga do Jaskini Rozrywek","entry":"Jesteś na drodze prowadzącej do Jaskini Rozrywek.\nDalej wiedzie strome zejście, a z dołu dziwna muzyka.","x":-2,"y":1,"z":0},{"id":24,"name":"Zbrojownia","entry":"Jesteś w zbrojowni - sklep niedawno został otwarty\nSPRZEDAWCA (brzydka aura) STARA się wciśnąć ci jakiś towar \nNa ścianie wisi PLAKAT","x":-1,"y":1,"z":0},{"id":21,"name":"Ul. Sklepikowa 1","entry":"Jesteś na ulicy na ulicy Sklepikowej - jak sama nazwa wskazuje\nJest tu parę sklepików które być może ci się przydadzą","x":0,"y":1,"z":0},{"id":23,"name":"Piekarnia","entry":"Jesteś w piekarni, sklep przesiąknięty jest przyjemnym zapachem chleba\nPiekarz miło się na ciebie patrzy wycierając mąkę z twarzy\nNa ścianie jest PLAKAT cały w mące","x":1,"y":1,"z":0},{"id":26,"name":"Sklep magiczny","entry":"Wchodzisz do sklepu ale niczego tu nie ma poza SPRZEDAWCĄ i jego towarem","x":-1,"y":2,"z":0},{"id":22,"name":"Ul. Sklepikowa 2","entry":"Ciągnie się tędy ulica Sklepikowa. Jest tu jeszcze parę\ninteresujących sklepów. Dalej jest jeszcze kilka nieistotnych ulic.","x":0,"y":2,"z":0},{"id":25,"name":"Sklep wielobranżowy","entry":"Wszedłeś do sklepu wielobranżowego, stwierdzasz obecność SPRZEDAWCY\nNa drzwiach została wywieszona WYWIESZKA","x":1,"y":2,"z":0},{"id":109,"name":"Las 6","entry":"Wiele wskazuje na to, że jesteś w l tional":false,"blocked":null,"kind":"room"},{"from":78,"to":77,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":79,"to":77,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":80,"to":77,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":80,"to":83,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":80,"to":82,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":80,"to":81,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":81,"to":80,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":82,"to":80,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":83,"to":80,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":83,"to":84,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":84,"to":87,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":84,"to":83,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":84,"to":85,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":85,"to":84,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":85,"to":86,"command":"ZACHOD","conditional":true,"blocked":"Spróbuj ominąć te mega-przypakowane DRZWI których by się He-man nie powstydził!","kind":"room"},{"from":86,"to":85,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":87,"to":84,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":87,"to":88,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":88,"to":87,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":89,"to":75,"command":"GORA","conditional":false,"blocked":null,"kind":"room"},{"from":89,"to":20,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":99,"to":100,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":99,"to":22,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":100,"to":99,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":100,"to":110,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":100,"to":101,"command":"ZACHOD","conditional":true,"blocked":"QUEST-MASTER mówi ci: bardzo mi przykro ale musisz mieć PRZEPUSTKĘ","kind":"room"},{"from":101,"to":104,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":101,"to":105,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":101,"to":100,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":101,"to":102,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":102,"to":106,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":102,"to":107,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":102,"to":101,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":102,"to":103,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"},{"from":103,"to":108,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":103,"to":109,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":103,"to":102,"command":"WSCHOD","conditional":false,"blocked":null,"kind":"room"},{"from":104,"to":101,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":105,"to":101,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":106,"to":102,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":107,"to":102,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":108,"to":103,"command":"POLUDNIE","conditional":false,"blocked":null,"kind":"room"},{"from":109,"to":103,"command":"POLNOC","conditional":false,"blocked":null,"kind":"room"},{"from":110,"to":100,"command":"ZACHOD","conditional":false,"blocked":null,"kind":"room"}]};
    const { rooms, edges } = mapData;
    const roomById = new Map(rooms.map(room => [room.id, room]));
    const cellSize = 108;
    const roomSize = 92;
    const padding = cellSize / 2;
    const minX = Math.min(...rooms.map(room => room.x));
    const maxX = Math.max(...rooms.map(room => room.x));
    const minY = Math.min(...rooms.map(room => room.y));
    const maxY = Math.max(...rooms.map(room => room.y));
    const canvasWidth = (maxX - minX + 1) * cellSize;
    const canvasHeight = (maxY - minY + 1) * cellSize;
    const canvas = document.getElementById("map-canvas");
    const connectionSvg = document.getElementById("connections");
    const layerList = document.getElementById("layer-list");
    const mapStatus = document.getElementById("map-status");
    const emptyState = document.getElementById("empty-state");
    const layers = [...new Set(rooms.map(room => room.z))].sort((a, b) => a - b);
    const layerColors = ["#e0a33b", "#39a5c3", "#49b58c", "#9c78d6", "#dd7181", "#74a5dc"];
    let activeZ = 0;

    canvas.style.width = `${canvasWidth}px`;
    canvas.style.height = `${canvasHeight}px`;
    canvas.style.backgroundSize = `${cellSize}px ${cellSize}px`;
    canvas.style.backgroundPosition = `${padding}px ${padding}px`;
    connectionSvg.setAttribute("viewBox", `0 0 ${canvasWidth} ${canvasHeight}`);
    connectionSvg.setAttribute("width", canvasWidth);
    connectionSvg.setAttribute("height", canvasHeight);

    function layerColor(z) {
      return layerColors[layers.indexOf(z) % layerColors.length];
    }

    function position(room) {
      return {
        x: padding + (room.x - minX) * cellSize,
        y: padding + (maxY - room.y) * cellSize,
      };
    }

    function appendSvgLine(fromId, toId, conditional, arrowEnd, offset, description) {
      const from = roomById.get(fromId);
      const to = roomById.get(toId);
      const a = position(from);
      const b = position(to);
      const length = Math.hypot(b.x - a.x, b.y - a.y);
      if (!length) return;

      const ux = (b.x - a.x) / length;
      const uy = (b.y - a.y) / length;
      const px = -uy * offset;
      const py = ux * offset;
      const inset = roomSize / 2 + 2;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", a.x + ux * inset + px);
      line.setAttribute("y1", a.y + uy * inset + py);
      line.setAttribute("x2", b.x - ux * inset + px);
      line.setAttribute("y2", b.y - uy * inset + py);
      line.setAttribute("class", conditional ? "connection conditional" : "connection");
      if (arrowEnd) line.setAttribute("marker-end", `url(#${conditional ? "conditional-arrow" : "arrow"})`);
      const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
      title.textContent = description;
      line.append(title);
      connectionSvg.append(line);
    }

    function addSameLayerConnections(z) {
      const visibleEdges = edges.filter(edge =>
        roomById.get(edge.from).z === z && roomById.get(edge.to).z === z);
      const groups = new Map();
      for (const edge of visibleEdges) {
        const key = [Math.min(edge.from, edge.to), Math.max(edge.from, edge.to)].join(":");
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(edge);
      }

      for (const group of groups.values()) {
        const a = group[0].from;
        const b = group[0].to;
        const forward = group.filter(edge => edge.from === a && edge.to === b);
        const reverse = group.filter(edge => edge.from === b && edge.to === a);
        const clearForward = forward.some(edge => !edge.conditional);
        const clearReverse = reverse.some(edge => !edge.conditional);
        const pairName = `${roomById.get(a).name} <-> ${roomById.get(b).name}`;

        if (clearForward && clearReverse) {
          appendSvgLine(a, b, false, false, 0, `Two-way exit: ${pairName}`);
        } else {
          for (const edge of group.filter(item => !item.conditional)) {
            appendSvgLine(edge.from, edge.to, false, true, 0, `${roomById.get(edge.from).name} exits to ${roomById.get(edge.to).name}`);
          }
        }

        const conditionalEdges = group.filter(edge => edge.conditional);
        for (let index = 0; index < conditionalEdges.length; index++) {
          const edge = conditionalEdges[index];
          const offset = conditionalEdges.length > 1 ? (index === 0 ? -3 : 3) : 0;
          const detail = edge.blocked ? ` (blocked: ${edge.blocked})` : "";
          appendSvgLine(edge.from, edge.to, true, true, offset,
            `Conditional exit: ${roomById.get(edge.from).name} to ${roomById.get(edge.to).name}${detail}`);
        }
      }
    }

    function verticalLinks(roomId) {
      const groups = new Map();
      for (const edge of edges) {
        const from = roomById.get(edge.from);
        const to = roomById.get(edge.to);
        if (from.z === to.z || edge.from !== roomId) continue;
        const key = String(edge.to);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(edge);
      }

      return [...groups.values()].map(group => {
        const edge = group[0];
        const from = roomById.get(roomId);
        const other = roomById.get(edge.to);
        const direction = other.z > from.z ? "UP" : "DOWN";
        return {
          direction,
          destination: other.name,
          destinationZ: other.z,
          conditional: group.some(item => item.conditional),
          detail: `Exit from ${from.name} via ${group.map(item => item.command).join(", ")} to ${other.name}${group.some(item => item.conditional) ? " (conditional)" : ""}`,
        };
      }).sort((left, right) =>
        Number(left.direction !== "UP") - Number(right.direction !== "UP"));
    }

    function addRoom(room) {
      const point = position(room);
      const tile = document.createElement("article");
      tile.className = "room";
      tile.style.width = `${roomSize}px`;
      tile.style.height = `${roomSize}px`;
      tile.style.left = `${point.x - roomSize / 2}px`;
      tile.style.top = `${point.y - roomSize / 2}px`;
      tile.style.borderColor = layerColor(room.z);
      tile.style.background = `color-mix(in srgb, ${layerColor(room.z)} 72%, #14202d)`;
      tile.title = room.entry || "No room-entry text available.";
      tile.setAttribute("aria-label", `${room.name}. ${room.entry}`);
      const name = document.createElement("span");
      name.className = "room-name";
      name.textContent = room.name;
      const coordinates = document.createElement("span");
      coordinates.className = "room-coordinates";
      coordinates.textContent = `(${room.x}, ${room.y}, ${room.z})`;
      const vertical = document.createElement("div");
      vertical.className = "vertical-links";
      for (const link of verticalLinks(room.id)) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = link.conditional ? "vertical-link conditional" : "vertical-link";
        chip.style.setProperty("--target-layer-color", layerColor(link.destinationZ));
        chip.title = link.detail;
        chip.setAttribute("aria-label", `${link.direction} to ${link.destination}; switch to destination layer`);
        chip.addEventListener("click", () => {
          activeZ = link.destinationZ;
          render();
        });
        const direction = document.createElement("strong");
        direction.className = "vertical-direction";
        direction.textContent = link.direction;
        const destination = document.createElement("span");
        destination.textContent = ` to: ${link.destination}`;
        chip.append(direction, destination);
        vertical.append(chip);
      }
      tile.append(name, coordinates, vertical);
      canvas.append(tile);
    }

    function render() {
      for (const oldLine of connectionSvg.querySelectorAll("line")) oldLine.remove();
      for (const oldRoom of canvas.querySelectorAll(".room")) oldRoom.remove();
      const buttons = layerList.querySelectorAll("button");
      for (const button of buttons) {
        const selected = Number(button.dataset.z) === activeZ;
        button.setAttribute("aria-pressed", String(selected));
      }

      if (activeZ === null) {
        mapStatus.textContent = "No layer selected";
        emptyState.hidden = false;
        return;
      }

      const visibleRooms = rooms.filter(room => room.z === activeZ);
      addSameLayerConnections(activeZ);
      for (const room of visibleRooms) addRoom(room);
      const linkCount = new Set(edges
        .filter(edge => roomById.get(edge.from).z === activeZ && roomById.get(edge.to).z === activeZ)
        .map(edge => [Math.min(edge.from, edge.to), Math.max(edge.from, edge.to)].join(":"))).size;
      const verticalCount = new Set(edges
        .filter(edge => {
          const from = roomById.get(edge.from);
          const to = roomById.get(edge.to);
          return from.z !== to.z && (from.z === activeZ || to.z === activeZ);
        })
        .map(edge => [Math.min(edge.from, edge.to), Math.max(edge.from, edge.to)].join(":"))).size;
      mapStatus.innerHTML = `<strong>Z = ${activeZ}</strong> - ${visibleRooms.length} rooms, ${linkCount} same-layer connections, ${verticalCount} vertical links`;
      emptyState.hidden = true;
    }

    for (const z of layers) {
      const button = document.createElement("button");
      button.className = "layer-toggle";
      button.type = "button";
      button.dataset.z = z;
      button.setAttribute("aria-pressed", String(z === activeZ));
      const dot = document.createElement("span");
      dot.className = "layer-dot";
      dot.style.setProperty("--layer-color", layerColor(z));
      const label = document.createElement("span");
      label.textContent = `Z = ${z}`;
      const count = document.createElement("span");
      count.className = "layer-count";
      count.textContent = rooms.filter(room => room.z === z).length;
      button.append(dot, label, count);
      button.addEventListener("click", () => {
        activeZ = activeZ === z ? null : z;
        render();
      });
      layerList.append(button);
    }

    render();
  </script>
